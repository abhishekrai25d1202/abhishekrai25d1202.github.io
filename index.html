<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ======================================================================
     DESIGN FILE. You do not need to edit this file.
     All your words and pictures live in content.js.
     ====================================================================== -->
<title>Abhishek Kumar Rai · PhD Scholar, IIT Bombay</title>
<meta name="description" content="Abhishek Kumar Rai, PhD Scholar (UGC-JRF), Centre for Educational Technology, IIT Bombay.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Abhishek Kumar Rai">
<meta property="og:description" content="PhD Scholar (UGC-JRF), Centre for Educational Technology, IIT Bombay">
<meta property="og:url" content="https://abhishekrai25d1202.github.io/">
<meta property="og:image" content="https://abhishekrai25d1202.github.io/main_image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* ---------- COLOURS (we will change these in the colour step) ---------- */
:root{--bg:#EFF3F1;--surface:#fff;--ink:#22333B;--muted:#53646b;--sage:#5E8B7E;--link:#3b6759;--clay:#C7A17A;--line:#d3dcd8;--chip:#dfe9e5;--bannerbg:#22333B}
:root[data-theme="dark"]{--bg:#172228;--surface:#22333B;--ink:#EFF3F1;--muted:#a9b8b3;--link:#8fc4b4;--line:#364a52;--chip:#2c434b;color-scheme:dark}
/* ---------------------------------------------------------------------- */
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-anchor:none}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'Work Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;font-weight:800;line-height:1.2;margin:0}
a{color:var(--link)}
a:focus-visible,button:focus-visible{outline:3px solid var(--clay);outline-offset:2px}

/* header and menu */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{font-family:Manrope,system-ui,sans-serif;font-weight:800;font-size:1.1rem;color:var(--ink);text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:.95rem;white-space:nowrap}
nav a.on{background:var(--ink);color:var(--bg)}
nav a:hover:not(.on){background:var(--chip)}
#theme{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
#banner{position:relative;height:250px;background:var(--bannerbg);overflow:hidden}
#banner > svg,#banner > img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
/* quote inside the banner (same on every page) */
.bq{position:absolute;inset:0;display:flex;align-items:center;margin:0}
.bq-w{width:100%;max-width:1080px;margin:auto;padding:0 20px 0 336px}
.bq-in{position:relative;display:inline-block;z-index:0;text-align:center}
.bq-in::before{content:"";position:absolute;inset:-50px -110px;z-index:-1;background:radial-gradient(closest-side,rgba(34,51,59,.95) 55%,rgba(34,51,59,0))}
.bq blockquote{margin:0}
.bq .sa{font-family:'Tiro Devanagari Sanskrit','Noto Serif Devanagari',serif;font-size:clamp(2.2rem,4.4vw,3.7rem);line-height:1.2;word-spacing:.25em;white-space:nowrap;color:#EDBE55;margin:0}
.bq .en{font-style:italic;color:#EFF3F1;font-size:clamp(1.05rem,1.75vw,1.45rem);letter-spacing:.03em;margin:6px 0 0}
.bq figcaption{display:flex;align-items:center;gap:14px;color:#b9c6c2;font-size:.86rem;letter-spacing:.08em;margin-top:12px;white-space:nowrap}
.bq figcaption::before,.bq figcaption::after{content:"";flex:1;min-width:24px;height:1px;background:rgba(237,190,85,.5)}
main{max-width:1080px;margin:auto;padding:48px 20px 24px}
.page{display:none}.page.on{display:block}

/* home */
.home{display:grid;grid-template-columns:260px 1fr;gap:56px}
.home aside{margin-top:-130px;position:relative}
.photo{width:220px;aspect-ratio:4/5;border-radius:12px;border:5px solid var(--bg);box-shadow:0 0 0 1px var(--line),0 12px 28px -14px rgba(0,0,0,.45);background:var(--chip);display:grid;place-items:center;font:800 3rem Manrope,system-ui,sans-serif;color:var(--link);overflow:hidden;margin-bottom:22px}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.home aside h1{font-size:1.5rem;text-wrap:balance}
.role{margin:8px 0 22px;color:var(--muted);font-size:.98rem}
.sl{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.sl a,.il{display:inline-flex;gap:10px;align-items:center}
.sl svg,.il svg{width:22px;height:22px;flex:none;color:var(--link)}
.about h2.pt{font-size:2.4rem;margin-bottom:14px}
.tagline{font-size:1.2rem;color:var(--muted);margin:0 0 26px;max-width:56ch}
.bio{max-width:62ch;margin:0 0 30px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px;padding:0;list-style:none}
.tags li{background:var(--chip);border-radius:99px;padding:4px 14px;font-size:.9rem}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;padding:10px 20px;border-radius:10px;font-weight:500;margin:0 10px 10px 0}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 48px;margin-top:72px}

/* shared list styles */
h2.pt{font-size:2rem;margin-bottom:12px}
.lead{color:var(--muted);max-width:64ch;margin:0 0 28px}
.grp{font-size:1.35rem;margin:44px 0 8px;padding-bottom:8px;border-bottom:2px solid var(--clay)}
.item{padding:18px 0;border-bottom:1px solid var(--line)}
.item .t{font-weight:600}.item .m{color:var(--muted);font-size:.95rem}
.item .y{float:right;color:var(--muted);margin-left:16px;font-variant-numeric:tabular-nums}
.me{font-weight:600;color:var(--ink)}
.lk a{margin-right:14px;font-size:.92rem}

/* research */
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px 48px}
.theme{border-left:4px solid var(--sage);padding:2px 0 2px 20px}
.theme h3{font-size:1.3rem;margin-bottom:4px}.theme p{margin:0}

/* activities: year by year */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chips button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yr{font-size:1.25rem;color:var(--link);margin:36px 0 6px}
.al{list-style:none;margin:0;padding:0}
.al li{display:grid;grid-template-columns:3.2em 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.al .no{color:var(--muted);font-variant-numeric:tabular-nums}
.al .t{font-weight:600}
.al .rl{color:var(--muted)}
.al .nt{display:inline-block;background:var(--clay);color:#22333B;font-size:.8rem;font-weight:600;border-radius:99px;padding:1px 10px;margin-left:4px}
.al .tg{display:inline-block;background:var(--chip);font-size:.78rem;border-radius:99px;padding:1px 10px;margin-left:4px;color:var(--muted)}

/* CV timeline */
.tl{position:relative;margin:28px 0 36px}
.tl::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:3px;transform:translateX(-50%);background:var(--sage)}
.ev{position:relative;width:50%;padding:0 38px 30px 0;text-align:right}
.ev:nth-child(even){margin-left:50%;padding:0 0 30px 38px;text-align:left}
.ev::before{content:"";position:absolute;right:-10px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--sage)}
.ev:nth-child(even)::before{right:auto;left:-10px}
.ev .d{color:var(--muted);font-size:.9rem;font-style:italic}
.ev h3{font-size:1.1rem;margin:2px 0}
.ev .m{color:var(--muted);font-size:.95rem}
.ev p{margin:4px 0 0}

/* contact */
.cgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center;margin-top:28px}
.cph{margin:0}
.cph figcaption{font-size:.8rem;color:var(--muted);margin-top:10px;min-height:1.3em}

/* photo carousel (Contact page) */
.car{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--chip);touch-action:pan-y}
.car .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--link)}.car .ph svg{width:56px;height:56px}
.car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}
.car.whole img{object-fit:contain;background:#14191c}
.car img.on{opacity:1}
.car-btn,.car-pause{position:absolute;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.car-btn{top:50%;transform:translateY(-50%);width:40px;height:40px}
.car-btn:hover,.car-pause:hover{background:rgba(0,0,0,.7)}
.car-btn svg{width:22px;height:22px}.car-pause svg{width:14px;height:14px}
.car .prev{left:10px}.car .next{right:10px}
.car-pause{right:10px;bottom:8px;width:28px;height:28px}
.car-dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:2px}
.car-dots button{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.car-dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .2s}
.car-dots button[aria-current="true"]::before{background:#fff;transform:scale(1.3)}
.car[data-n="0"] .car-btn,.car[data-n="1"] .car-btn,.car[data-n="0"] .car-dots,.car[data-n="1"] .car-dots,.car[data-n="0"] .car-pause,.car[data-n="1"] .car-pause{display:none}
.car:not([data-n="0"]) .ph{display:none}
@media (prefers-reduced-motion:reduce){.car img{transition:none}}
.cd{margin:0}.cd dt{font-weight:600}.cd dd{margin:0 0 18px;overflow-wrap:anywhere}

/* footer */
footer{margin-top:40px;background:var(--surface);border-top:3px solid var(--clay);color:var(--muted);font-size:.9rem}
footer .fc{max-width:1080px;margin:auto;padding:14px 20px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
footer ul{list-style:none;padding:0;margin:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 28px}
footer li a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
footer svg{width:20px;height:20px;flex:none;color:var(--link)}
footer.min ul{display:none}

/* error box (only appears if content.js has a mistake) */
#err{position:fixed;left:16px;right:16px;bottom:16px;z-index:99;max-width:720px;margin:auto;background:#fde8e8;color:#7a1414;border:2px solid #c62828;border-radius:10px;padding:16px 18px;font-size:.95rem;line-height:1.5}

/* phones */
@media(max-width:700px){
  .bar{flex-wrap:wrap;gap:8px 12px}
  nav{order:3;width:calc(100% + 40px);overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 14px;justify-content:space-between}
  nav::-webkit-scrollbar{display:none}
  nav{gap:2px}
  nav a{padding:6px 8px;font-size:.88rem}
  .home{grid-template-columns:1fr;gap:32px}
  .home aside{margin-top:-80px}
  .photo{width:170px}
  .about h2.pt{font-size:2rem}
  .bq{align-items:flex-start}
  #banner{height:240px}
  .bq-w{padding:22px 20px 0;text-align:center}
  .bq .sa{font-size:2rem;word-spacing:.2em}
  .bq .en{font-size:1rem}
  .bq figcaption{font-size:.7rem;letter-spacing:.04em;margin-top:8px;gap:10px;white-space:normal}
  .cols{margin-top:40px}
  .tl::before{left:10px}
  .ev,.ev:nth-child(even){width:100%;margin-left:0;padding:0 0 26px 36px;text-align:left}
  .ev::before,.ev:nth-child(even)::before{left:0;right:auto}
  .cgrid{grid-template-columns:1fr;gap:24px}
  .al li{grid-template-columns:2.8em 1fr}
}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="#home" id="brand"></a><nav id="nav" aria-label="Main"></nav><button id="theme" type="button">Dark mode</button></div></header>
<div id="banner"></div>
<main id="main"></main>
<footer id="foot"></footer>
<div id="err" role="alert" hidden></div>

<script>
/* Shows a friendly message if content.js has a typing mistake. */
function siteError(where, detail){
  var b = document.getElementById("err"); if (!b.hidden) return;
  b.hidden = false; b.textContent = "";
  var s = document.createElement("strong"); s.textContent = "Your website could not load its content. "; b.appendChild(s);
  b.appendChild(document.createTextNode(where + " "));
  b.appendChild(document.createElement("br"));
  b.appendChild(document.createTextNode("Open content.js on GitHub and look at " + (/line \d/.test(where) ? "that line and the line just above it" : "the lines you changed last") + " for a missing comma , or quote mark \". Or open History and go back to the last version that worked."));
  if (detail){ var d = document.createElement("div"); d.style.cssText = "margin-top:8px;font-size:.8rem;opacity:.8"; d.textContent = "Technical detail: " + detail; b.appendChild(d); }
}
addEventListener("error", function(e){
  if (e.filename && /content\.js/.test(e.filename)) siteError("There is a mistake in content.js on line " + e.lineno + ".", e.message);
});
</script>
<script src="content.js" charset="utf-8"></script>
<script>
(function(){
if (typeof SITE === "undefined"){ siteError("The file content.js is missing or has a mistake.", "Check it is named content.js (small letters) and sits next to index.html."); return; }
try { build(SITE); } catch(e){ siteError("Something in content.js is not in the shape the website expects.", e.message); console.error(e); }

function build(SITE){
  var S = Object.assign({titleLines:[], interests:[], news:[], emails:[], links:{}, research:[], publications:[], activities:[], education:[], awards:[], experience:[], quote:{}}, SITE);
  var L = S.links || {};
  var $ = function(s){ return document.querySelector(s); };
  var has = function(v){ return v !== undefined && v !== null && String(v).trim() !== ""; };
  var attr = function(v){ return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); };
  var yearNum = function(y){ var m = String(y == null ? "" : y).match(/\d{4}/); return m ? +m[0] : 0; };
  var byYear = function(a, b){ return yearNum(b.year) - yearNum(a.year) || a._i - b._i; };
  var PAGES = [["home","Home"],["research","Research"],["activities","Activities"],["cv","CV"],["contact","Contact"]];
  var ico = {
    scholar: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="4" fill="currentColor"/><path fill="#fff" d="M5 9h3v10H5zM6.5 4.5a1.7 1.7 0 110 3.4 1.7 1.7 0 010-3.4zM10 9h3v1.4c.5-.9 1.6-1.6 3.1-1.6 3 0 3.4 2 3.4 4.5V19h-3v-5c0-1.2 0-2.5-1.6-2.5S13 12.8 13 14v5h-3z"/></svg>',
    orcid: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><text x="12" y="16" text-anchor="middle" font-size="9" font-weight="700" font-family="Work Sans,sans-serif" fill="#fff">iD</text></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>'
  };
  var profiles = [["scholar","Google Scholar"],["orcid","ORCID"],["linkedin","LinkedIn"]].filter(function(d){ return has(L[d[0]]); });
  var emails = (has(S.email) || has(S.alternateEmail)) ? [S.email, S.alternateEmail].filter(has) : (S.emails || []).filter(has);
  var bold = function(s){ return has(S.nameInPapers) ? String(s).split(S.nameInPapers).join('<span class="me">' + S.nameInPapers + '</span>') : s; };
  var initials = String(S.name).split(/\s+/).filter(Boolean).map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase();
  var withIdx = function(list){ return (list || []).map(function(x, i){ return Object.assign({_i: i}, x); }); };

  /* banner */
  $("#banner").innerHTML = has(S.banner) ? '<img src="' + attr(S.banner) + '" alt="">' :
    '<svg viewBox="0 0 1200 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="1150" cy="30" r="170" fill="#5E8B7E"/><circle cx="1035" cy="190" r="62" fill="#C7A17A"/><circle cx="1035" cy="190" r="108" fill="none" stroke="#EFF3F1" stroke-opacity=".25" stroke-width="2"/><circle cx="120" cy="245" r="100" fill="#5E8B7E" fill-opacity=".55"/><circle cx="290" cy="48" r="30" fill="#C7A17A"/></svg>';
  var BQ = S.quote || {};
  if (has(BQ.sanskrit) || has(BQ.english)) $("#banner").insertAdjacentHTML("beforeend", '<figure class="bq"><div class="bq-w"><div class="bq-in"><blockquote>' + (has(BQ.sanskrit) ? '<p class="sa" lang="sa">' + BQ.sanskrit + '</p>' : '') + (has(BQ.english) ? '<p class="en">' + BQ.english + '</p>' : '') + '</blockquote>' + (has(BQ.source) ? '<figcaption>' + BQ.source + '</figcaption>' : '') + '</div></div></figure>');

  /* ---- HOME ---- */
  var social = profiles.map(function(d){ return '<li><a href="' + attr(L[d[0]]) + '">' + ico[d[0]] + d[1] + '</a></li>'; });
  if (emails[0]) social.push('<li><a href="mailto:' + attr(emails[0]) + '">' + ico.mail + 'Email</a></li>');
  var latest = S.showLatestPublications === false ? [] : withIdx(S.publications).sort(byYear).slice(0, 3);
  var newsList = S.showNews === false ? [] : S.news;
  var home = '<section class="page" id="p-home"><div class="home"><aside>'
    + '<div class="photo">' + (has(S.photo) ? '<img src="' + attr(S.photo) + '" alt="Portrait of ' + attr(S.name) + '">' : initials) + '</div>'
    + '<h1>' + S.name + '</h1><p class="role">' + S.titleLines.join("<br>") + '</p>'
    + (social.length ? '<ul class="sl">' + social.join("") + '</ul>' : '') + '</aside>'
    + '<div class="about"><h2 class="pt">About me</h2>'
    + (has(S.tagline) ? '<p class="tagline">' + S.tagline + '</p>' : '')
    + (has(S.bio) ? '<p class="bio">' + S.bio + '</p>' : '')
    + (S.interests.length ? '<ul class="tags">' + S.interests.filter(has).map(function(i){ return '<li>' + i + '</li>'; }).join("") + '</ul>' : '')
    + '<a class="btn" href="#research">Read my research</a><a class="btn alt" href="#activities">Activities</a><a class="btn alt" href="#cv">View CV</a></div></div>'
    + ((latest.length || newsList.length) ? '<div class="cols">'
      + (latest.length ? '<div><h3 class="grp">Latest publications</h3>' + latest.map(function(p){ return '<div class="item"><span class="y">' + (p.year || "") + '</span><div class="t">' + (has(p.link) ? '<a href="' + attr(p.link) + '">' + p.title + '</a>' : p.title) + '</div><div class="m">' + (p.venue || "") + '</div></div>'; }).join("") + '</div>' : '')
      + (newsList.length ? '<div><h3 class="grp">News</h3>' + newsList.map(function(n){ return '<div class="item"><span class="y">' + (n.date || "") + '</span><div>' + n.text + '</div></div>'; }).join("") + '</div>' : '')
      + '</div>' : '')
    + '</section>';

  /* ---- RESEARCH + PUBLICATIONS ---- */
  var pubs = withIdx(S.publications);
  var types = []; pubs.forEach(function(p){ if (types.indexOf(p.type) < 0) types.push(p.type); });
  var research = '<section class="page" id="p-research"><h2 class="pt">Research</h2>'
    + (S.research.length ? '<p class="lead">The questions I work on, in broad terms.</p><div class="rg">' + S.research.map(function(r){ return '<div class="theme"><h3>' + r.title + '</h3><p>' + r.text + '</p></div>'; }).join("") + '</div>' : '')
    + (pubs.length ? '<h2 class="pt" style="margin-top:56px">Publications</h2>'
      + (has(L.scholar) || has(L.orcid) ? '<p class="lead">Full list on ' + [has(L.scholar) ? '<a href="' + attr(L.scholar) + '">Google Scholar</a>' : '', has(L.orcid) ? '<a href="' + attr(L.orcid) + '">ORCID</a>' : ''].filter(Boolean).join(" and ") + '.</p>' : '')
      + types.map(function(t){
          return '<h3 class="grp">' + t + '</h3>' + pubs.filter(function(p){ return p.type === t; }).sort(byYear).map(function(p){
            var lk = (has(p.link) ? '<a href="' + attr(p.link) + '">' + (/doi\.org/.test(p.link) ? "DOI" : "Link") + '</a>' : '') + (has(p.pdf) ? '<a href="' + attr(p.pdf) + '">PDF</a>' : '');
            return '<div class="item"><span class="y">' + (p.year || "") + '</span><div class="t">' + p.title + '</div><div class="m">' + (has(p.authors) ? bold(p.authors) + (/\.\s*$/.test(p.authors) ? ' ' : '. ') : '') + (p.venue || "") + '</div>' + (lk ? '<div class="lk">' + lk + '</div>' : '') + '</div>';
          }).join("");
        }).join("") : '')
    + '</section>';

  /* ---- ACTIVITIES (year by year, numbered) ---- */
  var LABEL = {"Teaching": "Teaching", "Student role": "Student roles", "Presentation": "Presentations", "Volunteering": "Organising & volunteering"};
  var label = function(t){ return LABEL[t] || t; };
  var acts = withIdx(S.activities);
  var aTypes = Object.keys(LABEL).filter(function(t){ return acts.some(function(a){ return a.type === t; }); });
  acts.forEach(function(a){ if (has(a.type) && aTypes.indexOf(a.type) < 0) aTypes.push(a.type); });
  var count = function(t){ return acts.filter(function(a){ return a.type === t; }).length; };
  var activities = '<section class="page" id="p-activities"><h2 class="pt">Activities</h2>'
    + '<p class="lead">Teaching, student roles, presentations and volunteering, newest first.</p>'
    + (aTypes.length > 1 ? '<div class="chips" role="group" aria-label="Show only"><button type="button" data-t="" aria-pressed="true">All (' + acts.length + ')</button>'
      + aTypes.map(function(t){ return '<button type="button" data-t="' + attr(t) + '" aria-pressed="false">' + label(t) + ' (' + count(t) + ')</button>'; }).join("") + '</div>' : '')
    + '<div id="actList"></div></section>';

  /* ---- CV ---- */
  var evt = function(e){ return '<div class="ev"><div class="d">' + (e.when || "") + '</div><h3>' + e.title + '</h3>' + (has(e.where) ? '<div class="m">' + e.where + '</div>' : '') + (has(e.text) ? '<p>' + e.text + '</p>' : '') + '</div>'; };
  var cvGroups = [["Education", S.education], ["Experience", S.experience], ["Fellowships, qualifications and awards", S.awards]]
    .filter(function(g){ return g[1] && g[1].length; })
    .map(function(g){ return '<h3 class="grp">' + g[0] + '</h3><div class="tl">' + g[1].map(evt).join("") + '</div>'; }).join("");
  var cv = '<section class="page" id="p-cv"><h2 class="pt">CV</h2><p class="lead">Education, fellowships and experience.</p>'
    + (has(S.cvFile) ? '<a class="btn" href="' + attr(S.cvFile) + '">Download CV (PDF)</a>' : '') + cvGroups + '</section>';

  /* ---- CONTACT ---- */
  var rows = emails.map(function(m, i){ return '<dt>' + (i ? "Alternate email" : "Email") + '</dt><dd><a class="il" href="mailto:' + attr(m) + '">' + ico.mail + m + '</a></dd>'; }).join("")
    + (has(S.address) ? '<dt>Address</dt><dd>' + S.address + '</dd>' : '')
    + (has(L.scholar) ? '<dt>Google Scholar</dt><dd><a class="il" href="' + attr(L.scholar) + '">' + ico.scholar + 'View profile</a></dd>' : '')
    + (has(L.orcid) ? '<dt>ORCID</dt><dd><a class="il" href="' + attr(L.orcid) + '">' + ico.orcid + String(L.orcid).replace(/^https?:\/\/orcid\.org\//, "") + '</a></dd>' : '')
    + (has(L.linkedin) ? '<dt>LinkedIn</dt><dd><a class="il" href="' + attr(L.linkedin) + '">' + ico.linkedin + 'View profile</a></dd>' : '')
    + (has(L.instagram) ? '<dt>Instagram</dt><dd><a class="il" href="' + attr(L.instagram) + '">' + ico.instagram + 'My photography</a></dd>' : '');
  var svg = function(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; };
  var PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
  var fig = '<figure class="cph"><div class="car' + (S.galleryShowWhole === true ? ' whole' : '') + '" id="car" data-n="0" role="region" aria-roledescription="carousel" aria-label="Photographs by ' + attr(S.name) + '">'
    + '<div class="ph">' + ico.instagram + '</div>'
    + '<button type="button" class="car-btn prev" aria-label="Previous photo">' + svg("M15 5l-7 7 7 7") + '</button>'
    + '<button type="button" class="car-btn next" aria-label="Next photo">' + svg("M9 5l7 7-7 7") + '</button>'
    + '<div class="car-dots"></div><button type="button" class="car-pause" aria-label="Pause slideshow">' + PAUSE + '</button></div>'
    + '<figcaption id="carCap"></figcaption></figure>';
  var contact = '<section class="page" id="p-contact"><h2 class="pt" style="text-align:center">Get in touch</h2><div class="cgrid">' + fig + '<dl class="cd">' + rows + '</dl></div></section>';

  /* ---- put it all on the page ---- */
  $("#main").innerHTML = home + research + activities + cv + contact;
  $("#brand").textContent = S.name;
  $("#nav").innerHTML = PAGES.map(function(p){ return '<a href="#' + p[0] + '" data-p="' + p[0] + '">' + p[1] + '</a>'; }).join("");
  var foot = profiles.map(function(d){ return '<li><a href="' + attr(L[d[0]]) + '">' + ico[d[0]] + d[1] + '</a></li>'; }).join("")
    + (has(L.instagram) ? '<li><a href="' + attr(L.instagram) + '">' + ico.instagram + 'Instagram</a></li>' : '');
  $("#foot").innerHTML = '<div class="fc">' + (foot ? '<ul>' + foot + '</ul>' : '') + '<span>© ' + new Date().getFullYear() + ' ' + S.name + '</span></div>';

  /* links to other websites (and PDFs) open in a new tab */
  function newTabs(root){
    root.querySelectorAll("a[href]").forEach(function(a){
      var h = a.getAttribute("href");
      if (/^https?:\/\//i.test(h) || /\.pdf$/i.test(h)){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
    });
  }

  function renderActs(t){
    var list = acts.filter(function(a){ return !t || a.type === t; }).sort(byYear);
    var n = list.length, html = "", cur = null;
    list.forEach(function(a){
      var y = String(a.year == null ? "" : a.year).trim();
      if (y !== cur){ if (cur !== null) html += "</ol>"; html += '<h3 class="yr">' + (y || "Other") + '</h3><ol class="al">'; cur = y; }
      var title = has(a.title) ? '<span class="t">' + (has(a.link) ? '<a href="' + attr(a.link) + '">' + a.title + '</a>' : a.title) + '</span>' : '';
      var main = [title, a.place, a.date].filter(has).join(", ");
      html += '<li><span class="no">[' + (n--) + ']</span><div>' + main
        + (has(a.role) ? ' <span class="rl">(Role: ' + a.role + ')</span>' : '')
        + (has(a.note) ? ' <span class="nt">' + a.note + '</span>' : '')
        + (!t && has(a.type) ? ' <span class="tg">' + label(a.type) + '</span>' : '')
        + '</div></li>';
    });
    if (cur !== null) html += "</ol>";
    var box = $("#actList"); box.innerHTML = html || "<p>Nothing here yet.</p>"; newTabs(box);
  }
  renderActs("");
  document.querySelectorAll(".chips button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".chips button").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      renderActs(b.dataset.t);
    });
  });
  newTabs(document);

  /* ---- PHOTO CAROUSEL: looks for gallery1, gallery2 ... next to index.html ---- */
  var galleryStarted = false;
  function startGallery(){
    if (galleryStarted) return; galleryStarted = true;
    var caps = Array.isArray(S.galleryCaptions) && S.galleryCaptions.length ? S.galleryCaptions : ["", "", "", "", ""];
    var EXT = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG"];
    var find = function(n){ return new Promise(function(done){
      var i = 0; (function next(){
        if (i >= EXT.length) return done(null);
        var src = "gallery" + n + "." + EXT[i++], im = new Image();
        im.onload = function(){ done(src); }; im.onerror = next; im.src = src;
      })();
    }); };
    Promise.all(caps.map(function(c, i){ return find(i + 1); })).then(function(srcs){
      var photos = []; srcs.forEach(function(src, i){ if (src) photos.push({src: src, cap: caps[i] || ""}); });
      var car = $("#car"), cap = $("#carCap"), dotsBox = car.querySelector(".car-dots"), pauseBtn = car.querySelector(".car-pause");
      car.dataset.n = photos.length;
      if (!photos.length) return;
      var imgs = photos.map(function(p, i){
        var im = document.createElement("img"); im.src = p.src; im.decoding = "async";
        im.alt = has(p.cap) ? p.cap : "Photograph " + (i + 1) + " by " + S.name;
        car.insertBefore(im, car.querySelector(".car-btn")); return im;
      });
      var dots = photos.map(function(p, i){
        var d = document.createElement("button"); d.type = "button"; d.setAttribute("aria-label", "Show photo " + (i + 1) + " of " + photos.length);
        d.onclick = function(){ show(i); restart(); }; dotsBox.appendChild(d); return d;
      });
      var cur = 0, timer = null, stopped = false, hover = false;
      var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      function show(i){
        cur = (i + photos.length) % photos.length;
        imgs.forEach(function(im, k){ im.classList.toggle("on", k === cur); });
        dots.forEach(function(d, k){ d.setAttribute("aria-current", k === cur ? "true" : "false"); });
        cap.textContent = [photos[cur].cap, S.photoCredit].filter(has).join(" · ");
      }
      function restart(){ clearInterval(timer); if (!stopped && !still) timer = setInterval(function(){ if (!hover && !document.hidden && location.hash === "#contact") show(cur + 1); }, 5000); }
      car.querySelector(".prev").onclick = function(){ show(cur - 1); restart(); };
      car.querySelector(".next").onclick = function(){ show(cur + 1); restart(); };
      pauseBtn.onclick = function(){
        stopped = !stopped; pauseBtn.innerHTML = stopped ? PLAY : PAUSE;
        pauseBtn.setAttribute("aria-label", stopped ? "Play slideshow" : "Pause slideshow"); restart();
      };
      car.addEventListener("mouseenter", function(){ hover = true; });
      car.addEventListener("mouseleave", function(){ hover = false; });
      car.addEventListener("focusin", function(){ hover = true; });
      car.addEventListener("focusout", function(){ hover = false; });
      car.addEventListener("keydown", function(e){ if (e.key === "ArrowLeft"){ show(cur - 1); restart(); } if (e.key === "ArrowRight"){ show(cur + 1); restart(); } });
      var x0 = null;
      car.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive: true});
      car.addEventListener("touchend", function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40){ show(cur + (dx < 0 ? 1 : -1)); restart(); } });
      if (still){ stopped = true; pauseBtn.style.display = "none"; }
      show(0); restart();
    });
  }

  /* page switching */
  function route(){
    var h = location.hash.slice(1) || "home", id = PAGES.some(function(p){ return p[0] === h; }) ? h : "home";
    document.querySelectorAll(".page").forEach(function(s){ s.classList.toggle("on", s.id === "p-" + id); });
    document.querySelectorAll("#nav a").forEach(function(a){ a.classList.toggle("on", a.dataset.p === id); });
    document.title = (id === "home" ? "" : PAGES.filter(function(p){ return p[0] === id; })[0][1] + " · ") + S.name;
    window.scrollTo(0, 0); $("#foot").classList.toggle("min", id === "home");
    if (id === "contact") startGallery();
  }
  addEventListener("hashchange", route); route();

  /* banner shrinks as you scroll */
  var bn = $("#banner"), bannerH = function(){ bn.style.height = Math.max(0, (innerWidth <= 700 ? 240 : 250) - scrollY) + "px"; };
  addEventListener("scroll", bannerH, {passive: true}); bannerH();

  /* light / dark mode */
  var root = document.documentElement, btn = $("#theme");
  function setTheme(t){ root.setAttribute("data-theme", t); btn.textContent = t === "dark" ? "Light mode" : "Dark mode"; try { localStorage.setItem("theme", t); } catch(e){} }
  var saved = null; try { saved = localStorage.getItem("theme"); } catch(e){}
  setTheme(saved || "light");
  btn.onclick = function(){ setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); };
}
})();
</script>
</body>
</html>
